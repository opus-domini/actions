name: Reusable runner smoke
run-name: Runner smoke [${{ inputs.install_id || github.run_id }}]

on:
  workflow_call:
    inputs:
      install_id:
        description: Optional installation correlation identifier
        required: false
        type: string
        default: ""
      services:
        description: Select the private service-container CI runtime
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: runner-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci-runner:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ductor-ci
    timeout-minutes: 20
    container:
      image: ${{ format('ductor.invalid/runtime/{0}:v1', inputs.services && 'go-node-services' || 'go-node') }}
      env:
        HOME: /github/home
        DUCTOR_JOB_TIMEOUT_SECONDS: "1200"
    steps:
      - name: Verify CI runtime capacity
        run: |
          ductor image status --pool "$DUCTOR_POOL"
          for executable in go node npm golangci-lint govulncheck; do
            command -v "$executable" >/dev/null
          done
          for executable in goreleaser syft cosign; do
            if command -v "$executable" >/dev/null; then
              exit 1
            fi
          done
          if [[ "${{ inputs.services }}" == true ]]; then
            socket_path="${DOCKER_HOST#unix://}"
            [[ "$socket_path" != "$DOCKER_HOST" ]]
            [[ -S "$socket_path" ]]
          else
            [[ -z "${DOCKER_HOST:-}" ]]
          fi

  release-runner:
    needs: ci-runner
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ductor-release
    timeout-minutes: 20
    container:
      image: ductor.invalid/runtime/go-release:v1
      env:
        HOME: /github/home
        DUCTOR_JOB_TIMEOUT_SECONDS: "1200"
    steps:
      - name: Verify release runtime capacity
        run: |
          ductor image status --pool "$DUCTOR_POOL"
          for executable in go node npm jq goreleaser syft cosign; do
            command -v "$executable" >/dev/null
          done
          for executable in golangci-lint govulncheck; do
            if command -v "$executable" >/dev/null; then
              exit 1
            fi
          done
